  <line x1="12" y1="104" x2="30" y2="104" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="116" x2="36" y2="116" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
