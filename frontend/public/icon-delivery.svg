<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1a4080"/>

  <!-- Speed / motion lines -->
  <line x1="36" y1="248" x2="102" y2="248" stroke="#D4AF37" stroke-width="10" stroke-linecap="round"/>
  <line x1="22" y1="282" x2="88" y2="282" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="36" y1="314" x2="94" y2="314" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

  <!-- Package / box body -->
  <rect x="118" y="168" width="276" height="236" rx="16" fill="white" opacity="0.93"/>

  <!-- Box top flap (open / in-transit look) -->
  <path d="M118 168 L118 212 L256 238 L394 212 L394 168 Z" fill="rgba(230,230,230,0.92)"/>
  <line x1="118" y1="212" x2="256" y2="238" stroke="#ccc" stroke-width="2"/>
  <line x1="394" y1="212" x2="256" y2="238" stroke="#ccc" stroke-width="2"/>

  <!-- Gold ribbon vertical -->
  <rect x="236" y="168" width="40" height="236" fill="#D4AF37" opacity="0.55"/>
  <!-- Gold ribbon horizontal -->
  <rect x="118" y="272" width="276" height="28" fill="#D4AF37" opacity="0.55"/>
  <!-- Ribbon cross highlight -->
  <rect x="246" y="168" width="20" height="236" fill="#D4AF37" opacity="0.3"/>
  <rect x="118" y="278" width="276" height="14" fill="#D4AF37" opacity="0.3"/>

  <!-- Bold check mark — "delivered" -->
  <path d="M162 300 L228 368 L362 196"
        fill="none" stroke="#1a4080" stroke-width="26" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.5"/>

  <!-- Location pin — top right of box -->
  <circle cx="394" cy="134" r="48" fill="#D4AF37"/>
  <circle cx="394" cy="118" r="24" fill="#1a4080"/>
  <path d="M394 154 Q368 194 394 248 Q420 194 394 154 Z" fill="#D4AF37"/>
</svg>
