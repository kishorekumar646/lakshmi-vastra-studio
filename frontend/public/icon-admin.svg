<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1E293B"/>

  <!-- Crown shape — main body -->
  <polygon points="80,356 80,210 168,296 256,120 344,296 432,210 432,356"
           fill="#D4AF37"/>

  <!-- Crown inner shading -->
  <polygon points="80,356 80,236 164,314 256,152 348,314 432,236 432,356"
           fill="#F59E0B" opacity="0.35"/>

  <!-- Crown base band -->
  <rect x="72" y="348" width="368" height="68" rx="14" fill="#D4AF37"/>
  <!-- Base band inner highlight -->
  <rect x="80" y="356" width="352" height="26" rx="8" fill="#F59E0B" opacity="0.3"/>

  <!-- Gem dots on base band -->
  <circle cx="160" cy="382" r="13" fill="#1E293B" opacity="0.45"/>
  <circle cx="256" cy="382" r="13" fill="#1E293B" opacity="0.45"/>
  <circle cx="352" cy="382" r="13" fill="#1E293B" opacity="0.45"/>

  <!-- Center top gem (large) -->
  <circle cx="256" cy="150" r="26" fill="white" opacity="0.92"/>
  <circle cx="256" cy="150" r="14" fill="#D4AF37"/>

  <!-- Left gem -->
  <circle cx="112" cy="268" r="16" fill="white" opacity="0.85"/>
  <circle cx="112" cy="268" r="8" fill="#D4AF37"/>

  <!-- Right gem -->
  <circle cx="400" cy="268" r="16" fill="white" opacity="0.85"/>
  <circle cx="400" cy="268" r="8" fill="#D4AF37"/>

  <!-- Subtle "LV" at base of crown -->
  <text x="256" y="400" text-anchor="middle" font-size="28" font-family="Georgia, serif"
        font-weight="bold" fill="#1E293B" opacity="0.55" letter-spacing="4">LV</text>
</svg>
