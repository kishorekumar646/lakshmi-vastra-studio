<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer background -->
  <rect width="512" height="512" rx="96" fill="#3D0A22"/>
  <!-- Main background -->
  <rect x="10" y="10" width="492" height="492" rx="86" fill="#7B1D45"/>

  <!-- Gold decorative inner border -->
  <rect x="28" y="28" width="456" height="456" rx="70" fill="none" stroke="#B8892A" stroke-width="4" opacity="0.55"/>

  <!-- Lotus: 8 outer petals -->
  <g transform="translate(256,222)">
    <g transform="rotate(0)">  <ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(45)"> <ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(90)"> <ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(135)"><ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(225)"><ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(270)"><ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
    <g transform="rotate(315)"><ellipse cx="0" cy="-118" rx="27" ry="62" fill="#F5E8C0" opacity="0.40"/></g>
  </g>

  <!-- Lotus: 6 inner petals -->
  <g transform="translate(256,222)">
    <g transform="rotate(0)">  <ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
    <g transform="rotate(60)"> <ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
    <g transform="rotate(120)"><ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
    <g transform="rotate(240)"><ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
    <g transform="rotate(300)"><ellipse cx="0" cy="-80" rx="21" ry="46" fill="#C9902A"/></g>
  </g>

  <!-- Lotus: highlight inner petals -->
  <g transform="translate(256,222)">
    <g transform="rotate(30)"> <ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
    <g transform="rotate(90)"> <ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
    <g transform="rotate(150)"><ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
    <g transform="rotate(210)"><ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
    <g transform="rotate(270)"><ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
    <g transform="rotate(330)"><ellipse cx="0" cy="-58" rx="16" ry="32" fill="#D4A94A"/></g>
  </g>

  <!-- Lotus center -->
  <circle cx="256" cy="222" r="35" fill="#8A5C10"/>
  <circle cx="256" cy="222" r="24" fill="#B8892A"/>
  <circle cx="256" cy="222" r="13" fill="#E8C860"/>

  <!-- Decorative divider -->
  <line x1="102" y1="390" x2="410" y2="390" stroke="#B8892A" stroke-width="2.5" opacity="0.65"/>
  <circle cx="256" cy="390" r="6" fill="#B8892A" opacity="0.65"/>

  <!-- Store name -->
  <text x="256" y="432" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700" fill="#D4A94A" text-anchor="middle" letter-spacing="9">LAKSHMI</text>
  <text x="256" y="474" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#9A7030" text-anchor="middle" letter-spacing="8">VASTRA STUDIO</text>
</svg>
