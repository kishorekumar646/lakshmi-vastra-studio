<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#7B1D45"/>
  <!-- Store building -->
  <rect x="36" y="80" width="120" height="80" rx="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="36" y="80" width="120" height="80" rx="6" fill="none" stroke="white" stroke-width="5"/>
  <!-- Door -->
  <rect x="78" y="118" width="36" height="42" rx="4" fill="white" opacity="0.9"/>
  <!-- Windows -->
  <rect x="48" y="96" width="28" height="22" rx="4" fill="white" opacity="0.8"/>
  <rect x="116" y="96" width="28" height="22" rx="4" fill="white" opacity="0.8"/>
  <!-- Awning -->
