  <line x1="68" y1="56" x2="60" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="96" y1="56" x2="96" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
